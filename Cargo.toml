[package]
name = "crabnet"
version = "0.1.0"
edition = "2024"

[dependencies]
open-cypher = "0.2.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "hooks", "backup"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.27"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "queries"
harness = false
