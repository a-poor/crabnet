[package]
name = "crabnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "An experimental embedded property-graph database for Rust, backed by SQLite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a-poor/crabnet"
documentation = "https://docs.rs/crabnet"
readme = "README.md"
keywords = ["graph", "database", "sqlite", "cypher", "embedded"]
categories = ["database"]

[dependencies]
open-cypher = "0.5.0"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "hooks", "backup"] }
serde = "1.0"
serde_json = { version = "1.0", features = ["float_roundtrip", "unbounded_depth", "raw_value"] }
tempfile = "3.27"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "queries"
harness = false
